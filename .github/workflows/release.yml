name: Build and Release Plugins

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      plugins:
        description: 'Plugins to build — comma-separated names or "all"'
        required: false
        default: 'all'

env:
  # Use Node.js 24 for all actions to avoid deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Detect which plugin directories changed ───────────────────────────
  detect-changes:
    name: Detect changed plugins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
      any_changed: ${{ steps.changed.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2        # need parent commit for diff

      - name: Find changed plugins
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_INPUT: ${{ github.event.inputs.plugins }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Discover all plugin directories (contain plugin.json at root)
          ALL_PLUGINS=()
          for d in */; do
            [ -f "${d}plugin.json" ] && ALL_PLUGINS+=("${d%/}")
          done
          echo "All plugins: ${ALL_PLUGINS[*]}"

          # ── workflow_dispatch ────────────────────────────────────────────
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$DISPATCH_INPUT" || "$DISPATCH_INPUT" == "all" ]]; then
              CHANGED=("${ALL_PLUGINS[@]}")
            else
              IFS=',' read -ra CHANGED <<< "$DISPATCH_INPUT"
              CHANGED=("${CHANGED[@]// /}")
            fi

          # ── push event ───────────────────────────────────────────────────
          else
            CHANGED=()

            # 1. Collect plugins whose source files changed in this push.
            if ! git rev-parse HEAD^ >/dev/null 2>&1; then
              # No parent commit (initial push) — treat all as changed.
              CHANGED=("${ALL_PLUGINS[@]}")
            else
              for plugin in "${ALL_PLUGINS[@]}"; do
                if git diff --name-only HEAD^ HEAD -- "${plugin}/" | grep -q .; then
                  CHANGED+=("$plugin")
                fi
              done
            fi

            # 2. Also build any plugin whose ZIP is missing from the latest release.
            # This handles the bootstrap case (workflow existed but release was never
            # created) and re-adds any accidentally deleted assets.
            EXISTING_ASSETS=$(gh release view latest \
              --repo "$REPO" \
              --json assets \
              --jq '[.assets[].name]' 2>/dev/null || echo "[]")

            for plugin in "${ALL_PLUGINS[@]}"; do
              # Skip if already queued for rebuild.
              already=false
              for c in "${CHANGED[@]:-}"; do [[ "$c" == "$plugin" ]] && already=true; done
              $already && continue

              ZIP="${plugin}.zip"
              if ! echo "$EXISTING_ASSETS" | jq -e --arg z "$ZIP" 'index($z) != null' >/dev/null; then
                echo "[INFO] Release asset '${ZIP}' missing — adding ${plugin} to build list."
                CHANGED+=("$plugin")
              fi
            done
          fi

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "No plugin changes and all ZIPs present in latest release — skipping build."
            echo "matrix={\"plugin\":[]}" >> "$GITHUB_OUTPUT"
            echo "any_changed=false"      >> "$GITHUB_OUTPUT"
          else
            echo "Plugins to build: ${CHANGED[*]}"
            JSON=$(printf '%s\n' "${CHANGED[@]}" | jq -R . | jq -cs '{plugin: .}')
            echo "matrix=$JSON"      >> "$GITHUB_OUTPUT"
            echo "any_changed=true"  >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Build a ZIP for each changed plugin ───────────────────────────────
  build:
    name: Build ${{ matrix.plugin }}
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP — ${{ matrix.plugin }}
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          OUT="${PLUGIN}.zip"

          # Exclude test files, compiled artefacts, and TypeScript declaration
          # maps produced by the standalone build — consumers get raw source.
          zip -r "$OUT" "$PLUGIN" \
            --exclude "*/node_modules/*" \
            --exclude "*/__tests__/*" \
            --exclude "*/__mocks__/*" \
            --exclude "*/__snapshots__/*" \
            --exclude "*/lib/*" \
            --exclude "*.spec.ts" \
            --exclude "*.spec.tsx" \
            --exclude "*.d.ts" \
            --exclude "*.d.ts.map" \
            --exclude "*.js.map"

          echo "Built: $OUT ($(du -sh "$OUT" | cut -f1))"

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-zip
          path: ${{ matrix.plugin }}.zip
          retention-days: 7

  # ── 3. Publish to GitHub Release ─────────────────────────────────────────
  release:
    name: Publish release
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all ZIP artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-zip'
          merge-multiple: true
          path: dist/

      - name: List built ZIPs
        run: ls -lh dist/

      - name: Compute release metadata
        id: meta
        env:
          MATRIX: ${{ needs.detect-changes.outputs.matrix }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          DATE="$(date -u +%Y-%m-%d)"
          echo "short_sha=$SHORT_SHA"         >> "$GITHUB_OUTPUT"
          echo "release_name=Latest ($DATE)"  >> "$GITHUB_OUTPUT"

          PLUGINS_LIST=$(echo "$MATRIX" | jq -r '.plugin[] | "- \(.)"')
          {
            echo "plugins_list<<EOF"
            echo "$PLUGINS_LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create / update "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: true
          body: |
            ## Eclipse Che Dashboard Plugins — latest build

            **Commit:** [`${{ steps.meta.outputs.short_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ### Updated plugins in this build
            ${{ steps.meta.outputs.plugins_list }}

            ### How to use

            Download the ZIP for the plugin you need and unpack it into the
            `plugins/` directory of your Eclipse Che Dashboard checkout:

            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/latest/<plugin-name>.zip \
              -o <plugin-name>.zip
            unzip <plugin-name>.zip -d /path/to/che-dashboard/plugins/
            bash /path/to/che-dashboard/scripts/prepare-plugins.sh
            ```

            Then rebuild the dashboard (`yarn build`) or run `yarn local:patch`.
          files: dist/*.zip
          fail_on_unmatched_files: false
